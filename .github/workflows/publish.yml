name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published. Uses PyPI Trusted
# Publishing (OIDC) — there is NO API token stored in the repo. Configure the
# matching "pending publisher" on PyPI first, with these values:
#   project: omg-llmkit | owner: OMGBrews | repo: llmkit
#   workflow: publish.yml | environment: pypi
# (PyPI distribution name is "omg-llmkit"; the import name stays "llmkit".)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to publish — must exactly match the version the selected ref builds as (e.g. 0.2.0). The version is derived from git, so the ref must be the vX.Y.Z tag itself; any other commit builds as a .devN candidate and is rejected below."
        required: true
        type: string

jobs:
  ci:
    # Run the full CI gate (lint, format, types, offline tests, dependency
    # floors, wheel smoke test) against the exact ref being released, before
    # anything is built for upload. `build` needs this, so a tag cut from a ref
    # CI never ran — a side branch, or a main commit whose CI failed — can't
    # reach the immutable PyPI slot untested. Runs the same jobs a push/PR does;
    # ci.yml exposes them via its `workflow_call` trigger.
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Load-bearing. The version is derived from git tags, and the default
          # shallow, tag-less checkout does not fail — it quietly derives
          # `0.0.1.devN+g<sha>` from a repo with no tags in it, and this job
          # would build that artifact for an immutable PyPI slot. The version
          # checks below catch it, but only because the tags are fetched here
          # can a correct release get past them at all.
          fetch-depth: 0

      - name: Install uv
        # Every action here is pinned to a full commit SHA (Dependabot bumps them
        # via the trailing `# vX.Y.Z` comment) — the OIDC publish job below holds
        # `id-token: write`, so a retagged action must never slip in. setup-uv
        # also stopped publishing floating major tags at v8, so its comment tracks
        # a full patch release.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # This job only builds; it installs no dependencies, so there is
          # nothing worth caching. Left at the default, setup-uv would key the
          # cache off a gitignored uv.lock and warn that it never invalidates.
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Read the version of the built artifact
        id: built
        # The version is no longer written down anywhere to grep, so the only
        # trustworthy statement of what this build *is* comes from the artifact
        # itself. Both guards below compare against this, not against a config
        # file that could disagree with what was actually produced.
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          built_version="$(basename "${wheels[0]}" | sed -E 's/^omg_llmkit-(.+)-py3-none-any\.whl$/\1/')"
          echo "built_version=${built_version}" >> "$GITHUB_OUTPUT"
          echo "Built version: ${built_version}"

      - name: Check the built version matches the release tag
        # Only the release trigger carries a tag; workflow_dispatch is guarded
        # by its confirm_version input below. The tag is now the source the
        # version is derived *from*, so this reads as a tautology — it is not.
        # It is what catches a build whose checkout could not see the tag, and
        # so derived a `.devN+g<sha>` candidate instead of the release.
        if: github.event_name == 'release'
        env:
          BUILT_VERSION: ${{ steps.built.outputs.built_version }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$BUILT_VERSION" != "$tag_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match the built version ${BUILT_VERSION}. A .devN or +local segment means the checkout could not see the release tag."
            exit 1
          fi
          echo "Tag and built version agree: ${BUILT_VERSION}"

      - name: Check confirm_version input matches the built version
        # A manual dispatch carries no tag, so it must name the version it
        # intends to publish — a stray dispatch can otherwise burn the
        # immutable PyPI slot for whatever version the ref carries.
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILT_VERSION: ${{ steps.built.outputs.built_version }}
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          if [ "$BUILT_VERSION" != "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version input (${CONFIRM_VERSION}) does not match the built version ${BUILT_VERSION}. The version is derived from git, so the dispatched ref must be the vX.Y.Z tag itself."
            exit 1
          fi
          echo "confirm_version and built version agree: ${BUILT_VERSION}"

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omg-llmkit
    permissions:
      id-token: write    # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
