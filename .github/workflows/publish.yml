name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published. Uses PyPI Trusted
# Publishing (OIDC) — there is NO API token stored in the repo. Configure the
# matching "pending publisher" on PyPI first, with these values:
#   project: omg-llmkit | owner: OMGBrews | repo: llmkit
#   workflow: publish.yml | environment: pypi
# (PyPI distribution name is "omg-llmkit"; the import name stays "llmkit".)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to publish — must exactly match `version` in pyproject.toml on the selected ref (e.g. 0.2.0)"
        required: true
        type: string

jobs:
  ci:
    # Run the full CI gate (lint, format, types, offline tests, dependency
    # floors, wheel smoke test) against the exact ref being released, before
    # anything is built for upload. `build` needs this, so a tag cut from a ref
    # CI never ran — a side branch, or a main commit whose CI failed — can't
    # reach the immutable PyPI slot untested. Runs the same jobs a push/PR does;
    # ci.yml exposes them via its `workflow_call` trigger.
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check release tag matches pyproject version
        # Only the release trigger carries a tag; workflow_dispatch is guarded
        # by its confirm_version input below.
        if: github.event_name == 'release'
        run: |
          project_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match pyproject version ${project_version}"
            exit 1
          fi
          echo "Tag and pyproject version agree: ${project_version}"

      - name: Check confirm_version input matches pyproject version
        # A manual dispatch carries no tag, so it must name the version it
        # intends to publish — a stray dispatch can otherwise burn the
        # immutable PyPI slot for whatever version the ref carries.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          project_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$project_version" != "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version input (${CONFIRM_VERSION}) does not match pyproject version ${project_version}"
            exit 1
          fi
          echo "confirm_version and pyproject version agree: ${project_version}"

      - name: Install uv
        # Every action here is pinned to a full commit SHA (Dependabot bumps them
        # via the trailing `# vX.Y.Z` comment) — the OIDC publish job below holds
        # `id-token: write`, so a retagged action must never slip in. setup-uv
        # also stopped publishing floating major tags at v8, so its comment tracks
        # a full patch release.
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          # This job only builds; it installs no dependencies, so there is
          # nothing worth caching. Left at the default, setup-uv would key the
          # cache off a gitignored uv.lock and warn that it never invalidates.
          enable-cache: false

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omg-llmkit
    permissions:
      id-token: write    # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
