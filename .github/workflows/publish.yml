name: Publish to PyPI

# Publishes to PyPI when a GitHub Release is published. Uses PyPI Trusted
# Publishing (OIDC) — there is NO API token stored in the repo. Configure the
# matching "pending publisher" on PyPI first, with these values:
#   project: omg-llmkit | owner: OMGBrews | repo: llmkit
#   workflow: publish.yml | environment: pypi
# (PyPI distribution name is "omg-llmkit"; the import name stays "llmkit".)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to publish — must exactly match `version` in pyproject.toml on the selected ref (e.g. 0.2.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release tag matches pyproject version
        # Only the release trigger carries a tag; workflow_dispatch is guarded
        # by its confirm_version input below.
        if: github.event_name == 'release'
        run: |
          project_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match pyproject version ${project_version}"
            exit 1
          fi
          echo "Tag and pyproject version agree: ${project_version}"

      - name: Check confirm_version input matches pyproject version
        # A manual dispatch carries no tag, so it must name the version it
        # intends to publish — a stray dispatch can otherwise burn the
        # immutable PyPI slot for whatever version the ref carries.
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
        run: |
          project_version="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$project_version" != "$CONFIRM_VERSION" ]; then
            echo "::error::confirm_version input (${CONFIRM_VERSION}) does not match pyproject version ${project_version}"
            exit 1
          fi
          echo "confirm_version and pyproject version agree: ${project_version}"

      - name: Install uv
        # Exact pin, unlike the actions/* above: setup-uv stopped publishing
        # floating major tags at v8 as supply-chain hardening, so `@v8` does
        # not resolve — only immutable release tags do.
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          # uv.lock is gitignored (a library doesn't commit its lock), so the
          # default `**/uv.lock` key matches nothing in a fresh checkout and the
          # cache never invalidates. pyproject.toml is what declares the deps.
          cache-dependency-glob: pyproject.toml
          # Keep this job's cache distinct from ci.yml's — same pyproject.toml,
          # but a release-time environment of its own.
          cache-suffix: publish

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      # Gate the publish on the same offline suite CI runs. publish.yml fires on
      # release/dispatch, while ci.yml runs only on push-to-main and PRs — so a
      # tag cut from a ref CI never saw (a side branch, or main before its run
      # finished) would otherwise build and ship straight to an immutable PyPI
      # slot with no test, lint, or type check behind it. Running the gate here
      # answers "does this exact ref pass?" directly, with no dependence on a
      # separate CI run having happened for this commit.
      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: basedpyright (recommended tier, no baseline)
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/omg-llmkit
    permissions:
      id-token: write    # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
