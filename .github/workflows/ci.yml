name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC. uv.lock is gitignored, so `check` and `floors`
    # both re-resolve from pyproject.toml on every run — this cron re-tests the
    # freshest resolution even when nobody pushes, so an upstream
    # instructor/litellm/pydantic release that breaks llmkit surfaces here
    # within a week instead of at a consumer's `pip install`.
    - cron: "0 6 * * 1"
  # Callable from publish.yml so a release runs this full gate against the exact
  # tagged ref before the wheel is built for upload. CI otherwise triggers only
  # on push-to-main and PRs, so a tag cut from a ref CI never ran (a side branch,
  # or a main commit whose CI failed) would reach the immutable PyPI slot
  # untested. No inputs: the caller checks out the same ref and runs the jobs
  # verbatim.
  workflow_call:

jobs:
  check:
    # Newest compatible resolution (uv's default). The full gate — lint, format,
    # types, and tests — run in every matrix cell. The matrix backs the support
    # claims: the 3.12 floor, 3.13, and 3.14 on ubuntu, plus one macOS and one
    # Windows cell so the `OS Independent` classifier is actually exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        # Every action here is pinned to a full commit SHA (Dependabot bumps them
        # via the trailing `# vX.Y.Z` comment). setup-uv also stopped publishing
        # floating major tags at v8 as supply-chain hardening, so its comment
        # tracks a full patch release, not a major.
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          enable-cache: true
          # uv.lock is gitignored (a library doesn't commit its lock), so the
          # default `**/uv.lock` key matches nothing in a fresh checkout and the
          # cache never invalidates. pyproject.toml is what declares the deps.
          cache-dependency-glob: pyproject.toml
          # Keep each cell's cache distinct — same pyproject.toml, different OS
          # and Python (and distinct from the floors job's resolution).
          cache-suffix: highest-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # `uv sync` installs the `dev` dependency group by default (uv's
        # default-groups), so no `--extra dev` is needed.
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: basedpyright (recommended tier, no baseline)
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest

  floors:
    # Lowest declared direct-dependency versions (`--resolution lowest-direct`).
    # Guards the compatibility floors in pyproject.toml: if a change starts
    # relying on a newer-than-floor API of litellm/instructor/pydantic, this job
    # fails instead of the declared floor quietly becoming a lie a fresh
    # `pip install` would resolve into. The critical 0.7.0 mode-pin break was a
    # live instance of exactly this — an untested resolution shipping broken.
    #
    # pytest only, not the full gate — the floors' value is the *runtime* signal.
    # basedpyright is deliberately excluded: json_schema.py's `_DumpKwargs`
    # TypedDict mirrors *current* pydantic's dump surface (a documented superset
    # that is never actually passed at runtime), so type-checking against the
    # floor pydantic's stubs reports false signature-mismatch errors. Ruff and
    # format are dependency-independent and already covered by `check`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: lowest-direct

      - name: Set up Python
        # Floors run on the 3.12 floor Python — the conventional lowest-Python
        # pairing. 3.14 is impossible here: litellm's floor 1.87.1 caps <3.14 and
        # pydantic 2.8.0 ships no cp314 wheel; the `check` job's 3.14 cell covers
        # the highest resolution instead.
        run: uv python install 3.12

      - name: Install dependencies at their declared floors
        # `uv sync` pulls the default `dev` group; `--resolution lowest-direct`
        # applies to groups too.
        run: uv sync --resolution lowest-direct

      - name: Tests
        run: uv run pytest

  package:
    # Builds the wheel and smoke-tests the *installed artifact* in a clean
    # environment. The two-package hatchling config, the py.typed marker, and
    # that `import llmkit` works from the built wheel are otherwise validated
    # only at publish time — against an immutable PyPI slot a broken artifact is
    # already on its way to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          # This job builds and installs into a throwaway venv; there is no
          # project sync worth caching, and the default key would tie to a
          # gitignored uv.lock and warn that it never invalidates.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Install the built wheel into a clean environment
        run: |
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl

      - name: Smoke-test the installed package
        run: |
          /tmp/smoke/bin/python - <<'PY'
          from importlib.resources import files
          import llmkit  # resolves to the installed wheel, not the source tree

          assert (files("llmkit") / "py.typed").is_file(), "py.typed marker missing from the wheel"

          # The omg_llmkit shim must raise its actionable redirect — a bare
          # ModuleNotFoundError would mean the package failed to install at all.
          try:
              import omg_llmkit
          except ModuleNotFoundError:
              raise SystemExit("omg_llmkit shim not installed")
          except ImportError as exc:
              assert "imported as" in str(exc), f"unexpected shim error: {exc}"
          else:
              raise SystemExit("omg_llmkit shim should raise, not import cleanly")

          print("wheel smoke test passed")
          PY

  ci-ok:
    # The single context branch protection requires. `check` is a matrix job, so
    # it never reports under that bare name — it reports as `check (ubuntu-latest,
    # 3.12)` and four siblings — and a ruleset requiring `check` waits forever on
    # a context nothing produces. Every PR then sits BLOCKED on a green tree and
    # merges only by admin bypass, which is indistinguishable from a gate that
    # works. One aggregator name is also stable across matrix edits: adding a
    # Python version here never needs a matching edit in repo settings.
    needs: [check, floors, package]
    # `always()` is load-bearing. Without it a failed dependency skips this job,
    # and GitHub counts a skipped required check as satisfied — the misconfigured
    # state this job exists to end, arrived at from the other direction.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every upstream job succeeded
        # Asserts the positive property rather than the absence of failure:
        # `cancelled` and `skipped` fail here, where a `!= 'failure'` test would
        # pass. The count guards the case word-splitting would otherwise swallow
        # — a renamed job interpolates as the empty string and simply vanishes
        # from the list, leaving the survivors to report a unanimous success.
        # Bump EXPECTED when adding a job to `needs`.
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.floors.result }} ${{ needs.package.result }}
          EXPECTED: "3"
        run: |
          echo "upstream results: ${RESULTS}"
          seen=0
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::an upstream job did not succeed (${RESULTS})"
              exit 1
            fi
            seen=$((seen + 1))
          done
          if [ "${seen}" -ne "${EXPECTED}" ]; then
            echo "::error::expected ${EXPECTED} upstream results, saw ${seen} (${RESULTS})"
            exit 1
          fi
          echo "all ${EXPECTED} upstream jobs succeeded"
