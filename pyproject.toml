[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omg-llmkit"
version = "0.6.0"
description = "A thin, opinionated, local-first structured-output + logging layer over LiteLLM"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OMGBrews" }]
keywords = ["llm", "litellm", "instructor", "structured-output", "openai", "anthropic", "gemini", "bedrock", "aws", "vertex-ai", "google-cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.87.1",
    "instructor>=1.15.1",
    "openai>=2.20.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    # Imported directly (the per-call AsyncRetrying fed to instructor's
    # max_retries); floor matches instructor's own tenacity requirement.
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
# Anthropic (Claude) routing, direct and via Bedrock. instructor imports the
# Anthropic SDK *only at call time* — and only on its ANTHROPIC_* usage-
# accounting path (`from anthropic.types import Usage` inside
# instructor/core/retry.py, guarded by `mode in {ANTHROPIC_JSON, ...}`). Plain
# `import instructor` / `from_litellm(..., ANTHROPIC_JSON)` construct fine
# without it; the SDK is reached only when an Anthropic (or Bedrock, which pins
# ANTHROPIC_JSON) completion actually runs. So it is opt-in: non-Anthropic
# hosts (e.g. Google-only) take on no Anthropic dependency, and the Anthropic /
# Bedrock providers raise a clear "install omg-llmkit[anthropic]" error at
# construction when it is absent.
anthropic = [
    "anthropic>=0.69",
]
# AWS Bedrock routing. LiteLLM's bedrock/ path needs boto3 for SigV4 request
# signing; it is opt-in so non-Bedrock installs take on no AWS dependency.
# Bedrock routes Claude and pins instructor's ANTHROPIC_JSON mode, so it also
# needs the Anthropic SDK at call time — hence it pulls in the `anthropic` extra.
bedrock = [
    "boto3>=1.34",
    "omg-llmkit[anthropic]",
]
# Google Vertex AI routing. LiteLLM's vertex_ai/ path mints and refreshes the
# Google OAuth access token it signs Gemini-on-Vertex requests with through
# `google.auth` (the Application Default Credentials chain), so the Vertex
# provider needs `google-auth` at call time. It is opt-in so non-Vertex installs
# take on no Google dependency, and the VertexProvider raises a clear "install
# omg-llmkit[vertex]" error at construction when it is absent. Deliberately just
# `google-auth` (the minimal credential dep the gemini-on-Vertex chat path
# imports), not the much heavier `google-cloud-aiplatform`, which targets
# instructor's `from_vertexai` client — a path this library does not use.
vertex = [
    "google-auth>=2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.15.0",
    "basedpyright>=1.39",
    # The offline test suite imports the Anthropic, Bedrock, and Vertex providers
    # and exercises their construction, which eagerly check for the Anthropic SDK
    # / boto3 (Bedrock) and google-auth (Vertex). Pull in the `bedrock` extra —
    # which itself includes `anthropic` — and `vertex`, so every provider's
    # construction dependency is present for dev/CI and `uv sync --extra dev`
    # yields a fully green suite.
    "omg-llmkit[bedrock]",
    "omg-llmkit[vertex]",
]
# Convenience: pull in every optional provider dependency at once, so a host
# that wants the full provider surface can `pip install 'omg-llmkit[all]'`
# instead of enumerating extras.
all = [
    "omg-llmkit[anthropic]",
    "omg-llmkit[bedrock]",
    "omg-llmkit[vertex]",
]

[project.urls]
Homepage = "https://github.com/OMGBrews/llmkit"
Repository = "https://github.com/OMGBrews/llmkit"
Issues = "https://github.com/OMGBrews/llmkit/issues"
Changelog = "https://github.com/OMGBrews/llmkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# ``omg_llmkit`` is a one-line import shim: the distribution installs as
# ``omg-llmkit`` but is imported as ``llmkit``; the shim turns a mistaken
# ``import omg_llmkit`` into an actionable redirect instead of a bare
# ModuleNotFoundError (see src/omg_llmkit/__init__.py).
packages = ["src/llmkit", "src/omg_llmkit"]

# --- Ruff (linter + formatter) ------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "PIE",  # misc lints
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by the formatter
    "RUF012", # mutable ClassVar annotations — too noisy for Pydantic-heavy code
    "RUF022", # unsorted __all__ — cosmetic, not worth churn
]

[tool.ruff.lint.isort]
known-first-party = ["llmkit", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tests/**" = ["B", "SIM"]

# --- Pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: makes real API calls and needs real credentials; only runs with --run-live (see tests/conftest.py)",
]
