[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omg-llmkit"
version = "0.1.3"
description = "A thin, opinionated, local-first structured-output + logging layer over LiteLLM"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "OMGBrews" }]
keywords = ["llm", "litellm", "instructor", "structured-output", "openai", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.87.1",
    "instructor>=1.15.1",
    "openai>=2.0.0",
    # instructor imports the Anthropic SDK to account usage for its native
    # ANTHROPIC_JSON mode (instructor/core/retry.py), so the Anthropic
    # provider fails at call time without it. Required, not optional, because
    # llmkit treats Anthropic as a first-class provider.
    "anthropic>=0.69",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff==0.15.0",
    "basedpyright>=1.39",
]

[project.urls]
Homepage = "https://github.com/OMGBrews/llmkit"
Repository = "https://github.com/OMGBrews/llmkit"
Issues = "https://github.com/OMGBrews/llmkit/issues"
Changelog = "https://github.com/OMGBrews/llmkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

# --- uv configuration ---------------------------------------------------

[tool.uv]

# --- Ruff (linter + formatter) ------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "PIE",  # misc lints
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by the formatter
    "RUF012", # mutable ClassVar annotations — too noisy for Pydantic-heavy code
    "RUF022", # unsorted __all__ — cosmetic, not worth churn
]

[tool.ruff.lint.isort]
known-first-party = ["llmkit", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tests/**" = ["B", "SIM"]

# --- Pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: makes real API calls and needs real credentials; only runs with --run-live (see tests/conftest.py)",
]
