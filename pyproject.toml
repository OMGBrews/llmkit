[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omg-llmkit"
version = "0.9.0"
description = "A thin, opinionated, local-first structured-output + logging layer over LiteLLM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OMGBrews" }]
keywords = ["llm", "litellm", "instructor", "structured-output", "openai", "anthropic", "gemini", "bedrock", "aws", "vertex-ai", "google-cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.95.0",
    # instructor's `from_litellm` validates the provider mode pins against its
    # LiteLLM mode registry at client construction (1.15.3 removed the
    # non-core modes from that registry, which broke three providers with
    # RegistryError; 1.15.4 is the version the current pins are verified on).
    # The registry is an unstable coupling surface, so 2.x is excluded until
    # measured. tests/providers/test_provider_contract.py constructs every
    # shipped pin against the real registry, so a drift inside this range
    # fails CI, not production.
    "instructor>=1.15.4,<2",
    "openai>=2.20.0",
    "pydantic>=2.8.0",
    # 6.0.0/6.0.1 ship no cp313 wheel and their sdist fails to build on 3.13
    # (their pinned Cython predates the 3.13 C API); 6.0.2 is the first release
    # with a 3.13 wheel, so 6.0.2 is the floor that installs on every supported
    # Python (the range must resolve on 3.13/3.14 too, not just the 3.12 floor).
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    # Imported directly (the per-call AsyncRetrying fed to instructor's
    # max_retries); floor matches instructor's own tenacity requirement.
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
# There is deliberately no `anthropic` extra anymore (removed with the
# Mode.JSON_SCHEMA repin): LiteLLM speaks the Anthropic HTTP API directly, and
# instructor >=1.15.4 reaches the Anthropic SDK only on an optional
# usage-accounting branch guarded by try/except ImportError — no llmkit code
# path requires it. Direct Anthropic (Claude) routing works on the core
# install.
#
# AWS Bedrock routing. LiteLLM's bedrock/ path needs boto3 for SigV4 request
# signing; it is opt-in so non-Bedrock installs take on no AWS dependency.
bedrock = [
    "boto3>=1.34",
]
# Google Vertex AI routing. LiteLLM's vertex_ai/ path mints and refreshes the
# Google OAuth access token it signs Gemini-on-Vertex requests with through
# `google.auth` (the Application Default Credentials chain), so the Vertex
# provider needs `google-auth` at call time. It is opt-in so non-Vertex installs
# take on no Google dependency, and the VertexProvider raises a clear "install
# omg-llmkit[vertex]" error at construction when it is absent. Deliberately just
# `google-auth` (the minimal credential dep the gemini-on-Vertex chat path
# imports), not the much heavier `google-cloud-aiplatform`, which targets
# instructor's `from_vertexai` client — a path this library does not use.
vertex = [
    "google-auth>=2.0",
]
# Convenience: pull in every optional provider dependency at once, so a host
# that wants the full provider surface can `pip install 'omg-llmkit[all]'`
# instead of enumerating extras.
all = [
    "omg-llmkit[bedrock]",
    "omg-llmkit[vertex]",
]

[project.urls]
Homepage = "https://github.com/OMGBrews/llmkit"
Repository = "https://github.com/OMGBrews/llmkit"
Issues = "https://github.com/OMGBrews/llmkit/issues"
Changelog = "https://github.com/OMGBrews/llmkit/blob/main/CHANGELOG.md"

# Maintainer tooling: the offline test + typecheck toolchain, as a PEP 735
# dependency group — NOT a public extra. Hatchling ignores [dependency-groups],
# so nothing here lands in the wheel/sdist metadata (no `Provides-Extra: dev`),
# keeping dev tooling off the published install surface. `uv sync` installs this
# group by default (uv's default-groups), so no `--extra dev`/`--group dev` flag
# is needed anywhere.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # 0.23.0–0.23.4 mis-collect package-scoped async tests on pytest 8
    # ('Package' object has no attribute 'obj' / zero tests collected);
    # 0.23.5 is the first release that collects and runs the suite.
    "pytest-asyncio>=0.23.5",
    # Exact pin, deliberately: `ruff format --check` output is version-sensitive,
    # so the format gate is only reproducible against one ruff. An exact pin in a
    # non-published group is conventional — the audit's objection was the pin on
    # the *public* surface, which the group migration removes, not the pin itself.
    "ruff==0.15.0",
    "basedpyright>=1.39",
    # The offline suite imports the Bedrock and Vertex providers and exercises
    # their construction, which eagerly checks for boto3 (Bedrock) and
    # google-auth (Vertex). uv resolves this project's own name to the workspace
    # source, so these self-referential extras pull the local package's extras (a
    # non-uv `pip install --group dev` would fetch omg-llmkit from PyPI instead —
    # acceptable for a maintainer-only group).
    "omg-llmkit[bedrock]",
    "omg-llmkit[vertex]",
]

[tool.hatch.build.targets.wheel]
# ``omg_llmkit`` is a one-line import shim: the distribution installs as
# ``omg-llmkit`` but is imported as ``llmkit``; the shim turns a mistaken
# ``import omg_llmkit`` into an actionable redirect instead of a bare
# ModuleNotFoundError (see src/omg_llmkit/__init__.py).
packages = ["src/llmkit", "src/omg_llmkit"]

# --- Ruff (linter + formatter) ------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modernize syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "PIE",  # misc lints
    "SIM",  # simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by the formatter
    "RUF012", # mutable ClassVar annotations — too noisy for Pydantic-heavy code
    "RUF022", # unsorted __all__ — cosmetic, not worth churn
]

[tool.ruff.lint.isort]
known-first-party = ["llmkit", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"tests/**" = ["B", "SIM"]

# --- Pytest --------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: makes real API calls and needs real credentials; only runs with --run-live (see tests/conftest.py)",
]
